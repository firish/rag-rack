name: Deploy docs

# Builds the mkdocs site and pushes to gh-pages on every push to main.
# Manual dispatch is also available for testing.
#
# One-time setup:
#   1. Settings → Pages → Source: "Deploy from a branch" → Branch: gh-pages /
#   2. The first run creates the gh-pages branch; subsequent runs update it.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/verifiable_rag/**"   # API reference is auto-generated from docstrings
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write   # mkdocs gh-deploy needs to push to gh-pages

jobs:
  build:
    name: Build & deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # mkdocs uses git history for last-modified dates

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          # The library itself is needed for mkdocstrings to import & inspect modules.
          python -m pip install -e .
          python -m pip install \
            mkdocs-material \
            "mkdocstrings[python]" \
            pymdown-extensions

      - name: Build the site
        run: mkdocs build --strict

      - name: Deploy to gh-pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          # mkdocs gh-deploy pushes the built site to the gh-pages branch.
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          mkdocs gh-deploy --force --clean --message "deploy: ${{ github.sha }}"
