site_name: verifiable-rag
site_description: Document-grounded Q&A with sentence-level citations, NLI verification, and calibrated refusal.
site_url: https://firish.github.io/rag-rack/
site_author: Rishi Gulati

repo_name: firish/rag-rack
repo_url: https://github.com/firish/rag-rack
edit_uri: edit/main/docs/

docs_dir: docs
strict: true

theme:
  name: material
  language: en
  features:
    - announce.dismiss
    - content.action.edit
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Anchor link to this section for reference
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      base_path:
        - .
        - examples
        - docs
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: sphinx
            docstring_section_style: table
            heading_level: 2
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            show_source: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/firish/rag-rack
  generator: false

nav:
  - Home: index.md
  - Getting started:
      - getting-started/quickstart.md
      - getting-started/installation.md
  - Concepts:
      - concepts/architecture.md
      - concepts/citation-flow.md
      - concepts/verification.md
      - concepts/strictness.md
      - concepts/configuration.md
  - How-to guides:
      - how-to/use-hhem-verifier.md
      - how-to/calibrate-threshold.md
      - how-to/yaml-config.md
      - how-to/render-audit-html.md
      - how-to/observability.md
      - how-to/contextual-retrieval.md
      - how-to/swap-llm-provider.md
      - how-to/local-only-setup.md
  - API reference:
      - api/index.md
      - api/pipeline.md
      - api/presets.md
      - api/ask.md
      - api/models.md
      - api/parsers.md
      - api/chunkers.md
      - api/embedders.md
      - api/indexers.md
      - api/rerankers.md
      - api/generators.md
      - api/verifiers.md
      - api/config.md
      - api/report.md
      - api/demo.md
  - Benchmarks: benchmarks/index.md
